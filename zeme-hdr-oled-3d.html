<!DOCTYPE html>
<html lang="cs"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Minimalistická HDR OLED 3D Země">
  <title>Země — HDR OLED 3D</title>
  
<script>
(function() {
  'use strict';

  // Prevent double-initialization
  if (window.__miniappPreviewInstrumented) return;
  window.__miniappPreviewInstrumented = true;

  var MAX_MESSAGE_LENGTH = 2000;
  var MAX_MESSAGES_PER_ENTRY = 10;
  var MAX_BUFFER_ENTRIES = 500;

  function generateSessionId() {
    try {
      if (window.crypto && window.crypto.getRandomValues) {
        var bytes = new Uint8Array(16);
        window.crypto.getRandomValues(bytes);
        var hex = '';
        for (var i = 0; i < bytes.length; i++) {
          var h = bytes[i].toString(16);
          if (h.length === 1) h = '0' + h;
          hex += h;
        }
        return hex;
      }
    } catch (e) {}
    return String(Date.now()) + '-' + Math.random().toString(16).slice(2);
  }

  var sessionId = generateSessionId();
  var seq = 0;
  var buffer = [];
  // Set when signalReady() fires; null until then. Ships in the backlog
  // snapshot so the builder can tell a booted app from a dead shell.
  var readyAt = null;

  // Boot snapshot computed at backlog-request time: visible text volume and
  // interactive element count are the hardened boot criteria (an app with a
  // silent console but ~0 text and 0 interactive elements is a broken shell).
  function computeSnapshot() {
    try {
      return {
        bodyTextChars: (document.body ? document.body.innerText.trim().length : 0),
        interactiveCount: document.querySelectorAll('button, a[href], input, select, textarea, [role="button"]').length,
        readyAt: readyAt
      };
    } catch (e) {
      return { bodyTextChars: 0, interactiveCount: 0, readyAt: readyAt };
    }
  }

  function clampBuffer() {
    if (buffer.length > MAX_BUFFER_ENTRIES) {
      buffer.splice(0, buffer.length - MAX_BUFFER_ENTRIES);
    }
  }

  // Helper to safely stringify and truncate messages
  function safeStringify(val) {
    if (val === null) return 'null';
    if (val === undefined) return 'undefined';
    if (typeof val === 'string') {
      return val.length > MAX_MESSAGE_LENGTH
        ? val.slice(0, MAX_MESSAGE_LENGTH) + '...'
        : val;
    }
    if (typeof val === 'number' || typeof val === 'boolean') {
      return String(val);
    }
    if (val instanceof Error) {
      return val.stack || val.message || String(val);
    }
    try {
      var str = JSON.stringify(val, null, 2);
      return str.length > MAX_MESSAGE_LENGTH
        ? str.slice(0, MAX_MESSAGE_LENGTH) + '...'
        : str;
    } catch (e) {
      try {
        return String(val);
      } catch (e2) {
        return '[Unserializable]';
      }
    }
  }

  function postToParent(payload, targetOrigin) {
    if (!window.parent || window.parent === window) return;
    try {
      window.parent.postMessage(payload, targetOrigin || '*');
    } catch (e) {
      // Silently ignore postMessage errors
    }
  }

  function record(level, messages, meta) {
    seq += 1;
    var entry = {
      type: 'miniapp-console',
      sessionId: sessionId,
      seq: seq,
      level: level,
      messages: messages,
      ts: Date.now()
    };
    if (meta && typeof meta === 'object') {
      entry.meta = meta;
    }
    buffer.push(entry);
    clampBuffer();
    postToParent(entry, '*');
  }

  function recordArgs(level, args, meta) {
    var messages = [];
    var len = Math.min(args.length, MAX_MESSAGES_PER_ENTRY);
    for (var i = 0; i < len; i++) {
      messages.push(safeStringify(args[i]));
    }
    if (args.length > MAX_MESSAGES_PER_ENTRY) {
      messages.push('... and ' + (args.length - MAX_MESSAGES_PER_ENTRY) + ' more');
    }
    record(level, messages, meta);
  }

  // Save original console methods
  var origLog = console.log;
  var origWarn = console.warn;
  var origError = console.error;

  // Override console methods
  console.log = function() {
    recordArgs('log', arguments);
    return origLog.apply(console, arguments);
  };

  console.warn = function() {
    recordArgs('warn', arguments);
    return origWarn.apply(console, arguments);
  };

  console.error = function() {
    recordArgs('error', arguments);
    return origError.apply(console, arguments);
  };

  function formatResourceTarget(target) {
    try {
      if (!target) return null;
      var tag = (target.tagName || '').toString().toLowerCase();
      var url = '';
      if (tag === 'script') url = target.src || '';
      else if (tag === 'link') url = target.href || '';
      else if (tag === 'img') url = target.src || '';
      else if (tag === 'audio' || tag === 'video') url = target.src || '';
      else url = target.src || target.href || '';
      return { tag: tag || 'unknown', url: url || '' };
    } catch (e) {
      return null;
    }
  }

  function onCaptureError(event) {
    try {
      // Resource load errors: event.target is the element that failed to load.
      if (event && event.target && event.target !== window) {
        var info = formatResourceTarget(event.target);
        if (info) {
          record(
            'error',
            ['Resource failed to load: ' + info.tag + ' ' + info.url],
            { kind: 'resource-error', tag: info.tag, url: info.url }
          );
          return;
        }
      }

      // Some browsers also deliver ErrorEvent objects here.
      if (event && typeof event.message === 'string') {
        var message = event.message || 'Unknown error';
        var source = event.filename || '';
        var line = event.lineno || 0;
        var col = event.colno || 0;
        var stack = event.error && event.error.stack ? event.error.stack : '';

        var errorMsg = message;
        if (source) {
          errorMsg += ' at ' + source;
          if (line) {
            errorMsg += ':' + line;
            if (col) errorMsg += ':' + col;
          }
        }
        if (stack && errorMsg.indexOf(stack) === -1) {
          errorMsg += '\n' + stack;
        }

        record('error', [errorMsg], {
          kind: 'js-error-event',
          filename: source,
          lineno: line,
          colno: col
        });
      }
    } catch (e) {
      // ignore
    }
  }

  // Capture resource load errors (and some JS errors) in capture phase.
  window.addEventListener('error', onCaptureError, true);

  // Capture unhandled promise rejections
  window.addEventListener('unhandledrejection', function(event) {
    var reason = event.reason;
    var message = 'Unhandled Promise Rejection: ';

    if (reason instanceof Error) {
      message += reason.stack || reason.message || String(reason);
    } else {
      message += safeStringify(reason);
    }

    record('error', [message], { kind: 'unhandledrejection' });
  });

  // Capture CSP violations when supported (JS-only)
  try {
    document.addEventListener('securitypolicyviolation', function(event) {
      try {
        var violated = event.violatedDirective || event.effectiveDirective || '';
        var blocked = event.blockedURI || '';
        var srcFile = event.sourceFile || '';
        var line = event.lineNumber || 0;
        var col = event.columnNumber || 0;
        var sample = event.sample || '';
        var msg = 'CSP Violation: ' + violated;
        if (blocked) msg += ' blocked=' + blocked;
        if (srcFile) {
          msg += ' at ' + srcFile;
          if (line) {
            msg += ':' + line;
            if (col) msg += ':' + col;
          }
        }
        if (sample) msg += ' sample=' + sample;

        record('error', [msg], {
          kind: 'csp-violation',
          violatedDirective: violated,
          blockedURI: blocked,
          sourceFile: srcFile,
          lineNumber: line,
          columnNumber: col,
          disposition: event.disposition || ''
        });
      } catch (e) {}
    });
  } catch (e) {}

  // Worker / SharedWorker error capture (best-effort)
  function attachWorkerListeners(workerLike, scriptUrl, workerKind) {
    if (!workerLike || !workerLike.addEventListener) return;
    try {
      workerLike.addEventListener('error', function(ev) {
        try {
          var msg = ev && ev.message ? String(ev.message) : 'Worker error';
          var file = ev && ev.filename ? String(ev.filename) : '';
          var line = ev && ev.lineno ? Number(ev.lineno) : 0;
          var col = ev && ev.colno ? Number(ev.colno) : 0;
          var stack = ev && ev.error && ev.error.stack ? String(ev.error.stack) : '';

          var combined = msg;
          if (file) {
            combined += ' at ' + file;
            if (line) {
              combined += ':' + line;
              if (col) combined += ':' + col;
            }
          }
          if (stack && combined.indexOf(stack) === -1) {
            combined += '\n' + stack;
          }

          record('error', [combined], {
            kind: 'worker-error',
            workerKind: workerKind,
            scriptUrl: scriptUrl || ''
          });
        } catch (e) {}
      });

      workerLike.addEventListener('messageerror', function() {
        record('error', ['Worker messageerror'], {
          kind: 'worker-messageerror',
          workerKind: workerKind,
          scriptUrl: scriptUrl || ''
        });
      });
    } catch (e) {}
  }

  var patchedWorkers = { worker: false, sharedworker: false };

  function patchWorkerConstructor(name) {
    try {
      if (name === 'Worker' && patchedWorkers.worker) return;
      if (name === 'SharedWorker' && patchedWorkers.sharedworker) return;

      var Original = window[name];
      if (typeof Original !== 'function') return;

      function Patched(scriptURL, options) {
        var instance = new Original(scriptURL, options);
        try {
          if (name === 'SharedWorker') {
            attachWorkerListeners(instance, scriptURL, 'sharedworker');
            if (instance.port) {
              attachWorkerListeners(instance.port, scriptURL, 'sharedworker-port');
            }
          } else {
            attachWorkerListeners(instance, scriptURL, 'worker');
          }
        } catch (e) {}
        return instance;
      }

      Patched.prototype = Original.prototype;
      try {
        Object.setPrototypeOf(Patched, Original);
      } catch (e) {}

      window[name] = Patched;

      if (name === 'Worker') patchedWorkers.worker = true;
      if (name === 'SharedWorker') patchedWorkers.sharedworker = true;
    } catch (e) {}
  }

  patchWorkerConstructor('Worker');
  patchWorkerConstructor('SharedWorker');

  // Handle screenshot requests from parent
  var html2canvasPromise = null;

  function ensureHtml2Canvas() {
    if (typeof html2canvas === 'function') {
      return Promise.resolve(html2canvas);
    }
    if (html2canvasPromise) return html2canvasPromise;

    html2canvasPromise = new Promise(function(resolve, reject) {
      try {
        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
        script.async = true;
        script.onload = function() {
          if (typeof html2canvas === 'function') {
            resolve(html2canvas);
          } else {
            reject(new Error('html2canvas loaded but not available'));
          }
        };
        script.onerror = function() {
          reject(new Error('Failed to load html2canvas'));
        };
        (document.head || document.documentElement || document.body).appendChild(script);
      } catch (e) {
        reject(e);
      }
    });

    return html2canvasPromise;
  }

  window.addEventListener('message', function(event) {
    // Only respond to parent window
    if (event.source !== window.parent) return;

    if (event.data && event.data.type === 'miniapp-parent-request-backlog') {
      try {
        postToParent({
          type: 'miniapp-console-backlog',
          sessionId: sessionId,
          lastSeq: seq,
          entries: buffer.slice(0),
          snapshot: computeSnapshot(),
          ts: Date.now()
        }, event.origin || '*');
      } catch (e) {}
      return;
    }

    if (!event.data || event.data.type !== 'request-miniapp-screenshot') return;

    // Check if html2canvas is available
    // Capture screenshot
    ensureHtml2Canvas()
      .then(function() {
        return html2canvas(document.body, {
          useCORS: true,
          allowTaint: true,
          scale: window.devicePixelRatio || 1,
          logging: false,
          backgroundColor: null
        });
      })
      .then(function(canvas) {
        var dataUrl = canvas.toDataURL('image/png');
        try {
          event.source.postMessage({
            type: 'miniapp-screenshot',
            imageDataUrl: dataUrl,
            ts: Date.now()
          }, event.origin || '*');
        } catch (e) {
          try {
            event.source.postMessage({
              type: 'miniapp-screenshot-error',
              error: 'Failed to send screenshot: ' + String(e)
            }, event.origin || '*');
          } catch (e2) {}
        }
      })
      .catch(function(err) {
        try {
          event.source.postMessage({
            type: 'miniapp-screenshot-error',
            error: String(err)
          }, event.origin || '*');
        } catch (e) {}
      });
  });

  // Signal that the preview is ready
  function signalReady() {
    try {
      readyAt = Math.round(performance.now());
    } catch (e) {}
    if (!window.parent || window.parent === window) return;
    try {
      window.parent.postMessage({
        type: 'miniapp-preview-ready',
        sessionId: sessionId,
        ts: Date.now()
      }, '*');
    } catch (e) {}
  }

  // Signal ready on DOMContentLoaded or immediately if already loaded
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', signalReady);
  } else {
    // DOM already loaded, signal ready after a small delay to ensure scripts have run
    setTimeout(signalReady, 100);
  }
})();
</script><script src="https://miniapps.ai/sdk/miniapps-ai-v1.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    html, body, #earth {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    #earth {
      position: fixed;
      inset: 0;
      cursor: grab;
    }

    #earth:active {
      cursor: grabbing;
    }

    #download-html {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 10;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      color: #f4f8ff;
      background: rgba(8, 16, 28, 0.72);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      font: 600 13px/1 system-ui, sans-serif;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    #download-html:hover,
    #download-html:focus-visible {
      border-color: rgba(125, 190, 255, 0.9);
      background: rgba(18, 42, 72, 0.9);
      outline: none;
    }

    #download-html:active {
      transform: scale(0.97);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <main id="earth" aria-label="Interaktivní 3D planeta Země"></main>
  <button id="download-html" type="button" aria-label="Stáhnout aplikaci jako HTML">
    Stáhnout HTML
  </button>
  <script>
    (() => {
      'use strict';

      const container = document.getElementById('earth');
      const downloadButton = document.getElementById('download-html');

      function downloadSingleFile() {
        try {
          const documentCopy = document.documentElement.cloneNode(true);
          documentCopy.querySelectorAll('#earth canvas').forEach((canvas) => canvas.remove());
          const html = '<!DOCTYPE html>\n' + documentCopy.outerHTML;
          const file = new Blob([html], { type: 'text/html;charset=utf-8' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(file);
          link.download = 'zeme-hdr-oled-3d.html';
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 1000);
          downloadButton.textContent = 'HTML staženo';
          setTimeout(() => {
            downloadButton.textContent = 'Stáhnout HTML';
          }, 1800);
        } catch (error) {
          downloadButton.textContent = 'Stažení se nepodařilo';
          setTimeout(() => {
            downloadButton.textContent = 'Stáhnout HTML';
          }, 2200);
        }
      }

      downloadButton.addEventListener('click', downloadSingleFile);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 1000);
      camera.position.set(0, 0.2, 3.05);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x000000, 1);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.045;
      controls.enablePan = false;
      controls.minDistance = 1.45;
      controls.maxDistance = 7;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.22;

      const textureLoader = new THREE.TextureLoader();
      textureLoader.crossOrigin = 'anonymous';
      const earthTexture = textureLoader.load(
        'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
        (texture) => {
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          texture.encoding = THREE.sRGBEncoding;
        }
      );
      const topologyTexture = textureLoader.load(
        'https://unpkg.com/three-globe/example/img/earth-topology.png',
        (texture) => {
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        }
      );

      const earthMaterial = new THREE.MeshPhongMaterial({
        map: earthTexture,
        bumpMap: topologyTexture,
        bumpScale: 0.035,
        shininess: 18,
        specular: new THREE.Color(0x557799)
      });
      const earth = new THREE.Mesh(
        new THREE.SphereGeometry(1, 256, 256),
        earthMaterial
      );
      scene.add(earth);

      const atmosphere = new THREE.Mesh(
        new THREE.SphereGeometry(1.035, 128, 128),
        new THREE.MeshBasicMaterial({
          color: 0x238bff,
          transparent: true,
          opacity: 0.16,
          side: THREE.BackSide,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      scene.add(atmosphere);

      scene.add(new THREE.AmbientLight(0x506080, 0.32));
      const sun = new THREE.DirectionalLight(0xffffff, 2.4);
      sun.position.set(4, 2.5, 5);
      scene.add(sun);

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      }

      window.addEventListener('resize', resize, { passive: true });
      resize();

      function render() {
        requestAnimationFrame(render);
        controls.update();
        renderer.render(scene, camera);
      }

      render();
    })();
  </script>


</body></html>
